<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Registration Form</title>
<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  color: #2b2b3d;
  padding: 30px 15px;
}

.card {
  max-width: 450px;
  margin: 0 auto;
}

h1 {
  text-align: center;
  font-size: 26px;
  margin-bottom: 15px;
}

hr {
  border: none;
  border-top: 1px solid #e6e6ec;
  margin-bottom: 20px;
}

fieldset {
  border: none;
  margin: 0 0 20px;
  padding: 0;
}

legend {
  font-weight: bold;
  margin-bottom: 8px;
  padding: 0;
}

.row {
  display: flex;
  gap: 10px;
  margin-bottom: 10px;
}

.row > div {
  flex: 1;
}

input, select {
  width: 100%;
  padding: 12px;
  border: 1px solid transparent;
  border-radius: 8px;
  background: #fce8d4;
  font-size: 15px;
  box-sizing: border-box;
}

input:focus, select:focus {
  border: 1px solid #f0a860;
  outline: none;
}

/* red border when a field didn't pass validation */
.invalid {
  border: 1px solid #e0574c !important;
}

.error-msg {
  color: #e0574c;
  font-size: 13px;
  margin-top: 3px;
  min-height: 15px; /* Prevents layout shift when error appears */
}

.radio-group {
  display: flex;
  gap: 40px;
}

.radio-group label {
  cursor: pointer;
}

.small-label {
  font-size: 13px;
  color: #8a8a99;
  display: block;
  margin-bottom: 6px;
}

.actions {
  text-align: center;
  margin-top: 25px;
}

button {
  background: #f0a860;
  color: #fff;
  border: none;
  padding: 13px 40px;
  border-radius: 8px;
  font-size: 16px;
  cursor: pointer;
  transition: background 0.2s;
}

button:hover {
  background: #e0944f;
}

.reset-btn {
  background: none;
  color: #8a8a99;
  margin-left: 10px;
}

.reset-btn:hover {
  background: #f2f2f5;
  color: #2b2b3d;
}

.success-banner {
  display: none;
  background: #e4f6e9;
  color: #2f7d4d;
  border-radius: 8px;
  padding: 12px;
  text-align: center;
  margin-bottom: 20px;
}
</style>
</head>
<body>
<div class="card">

  <h1>Student Registration Form</h1>
  <hr>

  <div class="success-banner" id="successBanner">Registration submitted successfully.</div>

  <!-- Added novalidate so our custom JS handles the errors instead of browser tooltips -->
  <form id="regForm" novalidate>

    <fieldset>
      <legend>Student Name</legend>
      <div class="row">
        <div>
          <input type="text" id="firstName" placeholder="First" aria-label="First Name">
          <div class="error-msg" id="err-firstName"></div>
        </div>
        <div>
          <input type="text" id="lastName" placeholder="Last" aria-label="Last Name">
          <div class="error-msg" id="err-lastName"></div>
        </div>
      </div>
    </fieldset>

    <fieldset>
      <legend>Date of Birth</legend>
      <input type="date" id="dob" aria-label="Date of Birth">
      <div class="error-msg" id="err-dob"></div>
    </fieldset>

    <fieldset>
      <legend>Gender</legend>
      <div class="radio-group">
        <label><input type="radio" name="gender" value="Male"> Male</label>
        <label><input type="radio" name="gender" value="Female"> Female</label>
      </div>
      <div class="error-msg" id="err-gender"></div>
    </fieldset>

    <fieldset>
      <legend>Address</legend>

      <div style="margin-bottom:10px;">
        <input type="text" id="street1" placeholder="Street Address" aria-label="Street Address">
        <div class="error-msg" id="err-street1"></div>
      </div>

      <div style="margin-bottom:10px;">
        <input type="text" id="street2" placeholder="Street Address Line 2" aria-label="Street Address Line 2">
      </div>

      <div class="row">
        <div>
          <input type="text" id="city" placeholder="City" aria-label="City">
          <div class="error-msg" id="err-city"></div>
        </div>
        <div>
          <input type="text" id="region" placeholder="Region" aria-label="Region">
        </div>
      </div>

      <div class="row">
        <div>
          <input type="text" id="zip" placeholder="Postal / Zip Code" aria-label="Postal Code">
          <div class="error-msg" id="err-zip"></div>
        </div>
        <div>
          <select id="country" aria-label="Country">
            <option value="">Select a country</option>
            <option value="Zimbabwe" selected>Zimbabwe</option>
            <option value="Romania">Romania</option>
            <option value="United States">United States</option>
            <option value="United Kingdom">United Kingdom</option>
            <option value="Germany">Germany</option>
            <option value="France">France</option>
            <option value="Other">Other</option>
          </select>
        </div>
      </div>
    </fieldset>

    <fieldset>
      <legend>Contact</legend>
      <div class="row">
        <div>
          <label for="email" class="small-label">Email</label>
          <input type="email" id="email" placeholder="you@example.com">
          <div class="error-msg" id="err-email"></div>
        </div>
        <div>
          <label for="phone" class="small-label">Phone number</label>
          <input type="tel" id="phone" placeholder="(555) 555-5555">
          <div class="error-msg" id="err-phone"></div>
        </div>
      </div>
    </fieldset>

    <div class="actions">
      <button type="submit">Submit</button>
      <button type="reset" class="reset-btn">Reset</button>
    </div>

  </form>
</div>

<script>
var form = document.getElementById('regForm');
var successBanner = document.getElementById('successBanner');

var requiredFields = ['firstName', 'lastName', 'dob', 'street1', 'city', 'zip', 'email', 'phone'];

var messages = {
  firstName: 'First name is required.',
  lastName: 'Last name is required.',
  dob: 'Date of birth is required.',
  street1: 'Street address is required.',
  city: 'City is required.',
  zip: 'Postal / zip code is required.',
  email: 'Email is required.',
  phone: 'Phone number is required.'
};

function showError(fieldId, msg) {
  document.getElementById('err-' + fieldId).textContent = msg;

  var field = document.getElementById(fieldId);
  if (!field) return;

  if (msg) {
    field.classList.add('invalid');
  } else {
    field.classList.remove('invalid');
  }
}

form.addEventListener('reset', function () {
  successBanner.style.display = 'none';

  for (var i = 0; i < requiredFields.length; i++) {
    showError(requiredFields[i], '');
  }
  showError('gender', '');
});

form.addEventListener('submit', function (e) {
  e.preventDefault();
  var ok = true;

  for (var i = 0; i < requiredFields.length; i++) {
    var id = requiredFields[i];
    var value = document.getElementById(id).value.trim();
    if (value === '') {
      showError(id, messages[id]);
      ok = false;
    } else {
      showError(id, '');
    }
  }

  // Updated to actually check for both '@' and '.'
  var email = document.getElementById('email').value.trim();
  if (email !== '' && (!email.includes('@') || !email.includes('.'))) {
    showError('email', 'Please enter a valid email address.');
    ok = false;
  }

  var genderPicked = document.querySelector('input[name="gender"]:checked');
  if (!genderPicked) {
    showError('gender', 'Please select a gender.');
    ok = false;
  } else {
    showError('gender', '');
  }

  if (ok) {
    successBanner.style.display = 'block';
    successBanner.scrollIntoView({ behavior: 'smooth' });
    form.reset(); // Optional: clears the form after a successful submission
  } else {
    successBanner.style.display = 'none';
  }
});
</script>
</body>
</html>
